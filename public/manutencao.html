<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Em manutenção</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f6f2ef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            color: #2b2b2b;
        }

        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 600px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        p {
            font-size: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #6b6b6b;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: #2b2b2b;
            margin: 2rem auto;
            opacity: 0.4;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Em manutenção</h1>
        <div class="divider"></div>
        <p>Voltamos em breve</p>
    </div>
</body>

</html>
